{% extends "base.html" %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <form method="POST" action="{{ url_for('admin_login') }}" style="background:#fff;border:1px solid #E4DDD0;border-radius:14px;padding:2.5rem;width:100%;max-width:360px;">
    <h2 style="font-family:'Playfair Display',serif;margin-bottom:1.5rem;">Admin Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autofocus>
    </div>
    <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">Login</button>
  </form>
</div>
{% endblock %}
