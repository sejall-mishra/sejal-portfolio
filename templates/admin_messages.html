{% extends "base.html" %}
{% block content %}
<div style="max-width:1000px;margin:0 auto;padding:3rem 1.5rem;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
    <h2 style="font-family:'Playfair Display',serif;">Contact Messages ({{ messages|length }})</h2>
    <a href="{{ url_for('admin_logout') }}" class="btn-outline">Logout</a>
  </div>

  {% if messages|length == 0 %}
    <p style="color:#6b6457;">No messages yet.</p>
  {% endif %}

  {% for m in messages %}
  <div style="background:#fff;border:1px solid #E4DDD0;border-radius:12px;padding:1.5rem;margin-bottom:1.2rem;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;">
      <strong>{{ m['name'] }}</strong>
      <span style="color:#6b6457;font-size:.85rem;">{{ m['created_at'] }}</span>
    </div>
    <p style="color:#6b6457;margin-bottom:.6rem;">
      <a href="mailto:{{ m['email'] }}" style="color:#C1613D;">{{ m['email'] }}</a>
    </p>
    <p>{{ m['message'] }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
